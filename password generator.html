<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 600;
      color: #555;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .checkbox-group {
      margin-bottom: 15px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .checkbox-group input {
      margin-right: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      border: none;
      color: white;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #45a049;
    }
    .output {
      margin-top: 20px;
      background: #e8f5e9;
      padding: 15px;
      font-family: monospace;
      font-size: 20px;
      text-align: center;
      border-radius: 6px;
      word-break: break-all;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Password Generator</h2>
    
    <label for="length">Password Length</label>
    <input type="number" id="length" min="4" max="64" value="12" />
    
    <div class="checkbox-group">
      <label><input type="checkbox" id="uppercase" checked /> Include Uppercase Letters</label>
      <label><input type="checkbox" id="lowercase" checked /> Include Lowercase Letters</label>
      <label><input type="checkbox" id="numbers" checked /> Include Numbers</label>
      <label><input type="checkbox" id="symbols" /> Include Symbols</label>
    </div>
    
    <button id="generateBtn">Generate Password</button>
    
    <div class="output" id="output"></div>
  </div>

  <script>
    const lengthInput = document.getElementById('length');
    const uppercaseCheckbox = document.getElementById('uppercase');
    const lowercaseCheckbox = document.getElementById('lowercase');
    const numbersCheckbox = document.getElementById('numbers');
    const symbolsCheckbox = document.getElementById('symbols');
    const outputDiv = document.getElementById('output');
    const generateBtn = document.getElementById('generateBtn');

    const uppercaseLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowercaseLetters = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

    function generatePassword() {
      let length = +lengthInput.value;
      let charset = "";

      if (uppercaseCheckbox.checked) charset += uppercaseLetters;
      if (lowercaseCheckbox.checked) charset += lowercaseLetters;
      if (numbersCheckbox.checked) charset += numbers;
      if (symbolsCheckbox.checked) charset += symbols;

      if (charset === "") {
        outputDiv.textContent = "Please select at least one character type.";
        return;
      }

      let password = "";
      for (let i = 0; i < length; i++) {
        let randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
      }

      outputDiv.textContent = password;
    }

    generateBtn.addEventListener('click', generatePassword);
  </script>
</body>
</html>
